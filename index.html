<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Counting Arrangements — Mr. McLean Math</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#202124;--muted:#666b73;--border:#d9dde3;
  --accent:#1976d2;--accent-soft:#e8f1fb;--good:#247a3b;--bad:#b3261e;--focus:#f5b400;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
body.high-contrast{
  --bg:#000;--panel:#090909;--text:#fff;--muted:#ddd;--border:#777;
  --accent:#00d7ff;--accent-soft:#111;--good:#68ff8b;--bad:#ff7474;--focus:#ffea00;
}
.app{max-width:900px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(28px,5vw,36px)}
.mode-buttons,.toolbar,.math-modes,.ws-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{justify-content:space-between;margin-bottom:14px}
button,select,input{font:inherit}
button,select{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:9px 13px}
button{cursor:pointer;font-weight:650}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"],button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.practice{display:grid;gap:15px}
.question{font-size:clamp(21px,4vw,29px);font-weight:750;line-height:1.45;padding:18px;background:var(--accent-soft);border-radius:13px}
.note{text-align:center;color:var(--muted);font-size:14px}
.answer-row{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
input[type="text"]{width:min(280px,100%);font-size:21px;text-align:center;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text)}
.feedback{min-height:28px;text-align:center;font-size:18px;font-weight:700}
.feedback.correct{color:var(--good)}.feedback.incorrect{color:var(--bad)}.feedback.warn{color:var(--muted)}
.solution{max-width:680px;width:100%;margin:0 auto;background:var(--accent-soft);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.stats{display:flex;justify-content:center;gap:20px;color:var(--muted);font-size:15px}
.worksheet{display:none}
.ws-controls{margin-bottom:14px}
.ws-list{display:grid;gap:12px}
.ws-item{border:1px solid var(--border);border-radius:11px;padding:12px;break-inside:avoid}
.ws-q{font-size:17px;line-height:1.5}
.ws-answer{display:none;margin-top:8px;color:var(--good);font-weight:700}
.ws-work{display:none;margin-top:7px;background:var(--accent-soft);padding:9px;border-radius:9px}
.ws-reveal{margin-top:8px;padding:6px 10px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
@media(max-width:620px){.app{padding:13px}.panel{padding:14px}.answer-row{align-items:stretch}input[type="text"],.answer-row button{width:100%}}
@media print{
  header,.toolbar,footer,.ws-controls,.ws-reveal{display:none!important}
  body{background:#fff;color:#000}.app{max-width:none;padding:0}.panel{border:0;padding:0;background:#fff}
  .worksheet{display:block!important}.ws-answer,.ws-work{display:none!important}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Counting Arrangements</h1>
  <div class="mode-buttons" role="group" aria-label="View">
    <button id="practiceBtn" aria-pressed="true">Practice</button>
    <button id="worksheetBtn" aria-pressed="false">Worksheet</button>
  </div>
</header>

<div class="toolbar">
  <div class="math-modes" id="mathModes" role="group" aria-label="Mode">
    <button data-mode="regular" aria-pressed="true">Regular</button>
    <button data-mode="advanced" aria-pressed="false">Advanced</button>
  </div>
  <button id="contrastBtn" aria-pressed="false">High contrast</button>
</div>

<section id="practice" class="panel practice">
  <div id="question" class="question" aria-live="polite"></div>
  <div class="answer-row">
    <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="Whole-number answer" aria-label="Your answer">
    <button id="check" class="primary">Check</button>
    <button id="next" hidden>Next</button>
  </div>

  <div id="feedback" class="feedback" aria-live="polite"></div>
  <button id="showSolution" hidden style="justify-self:center">Show solution</button>
  <div id="solution" class="solution" hidden></div>

  <div class="stats">
    <span>Correct: <strong id="correctCount">0</strong></span>
    <span>Incorrect: <strong id="incorrectCount">0</strong></span>
  </div>
</section>

<section id="worksheet" class="panel worksheet">
  <div class="ws-controls">
    <label for="wsCount">Questions:</label>
    <select id="wsCount"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option></select>
    <button id="generateWs">Generate</button>
    <button id="revealAll">Reveal all</button>
    <button id="hideAll">Hide all</button>
    <button id="printWs">Print</button>
  </div>
  <div class="note" style="text-align:left;margin-bottom:14px">Find the number of possible arrangements or outcomes.</div>
  <div id="wsList" class="ws-list"></div>
</section>

<footer>Created by Mr. McLean Math</footer>
</div>

const state={
  view:"practice",
  mode:"regular",
  current:null,
  evaluated:false,
  correct:0,
  incorrect:0,
  regularPool:[],
  advancedPool:[],
  worksheetPrevious:{regular:[],advanced:[]},
  lastQuestionId:null
};

function shuffle(array){
  const arr=array.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function bankFor(mode){return mode==="regular"?regularBank:advancedBank}

function refillPool(mode){
  const poolName=mode==="regular"?"regularPool":"advancedPool";
  let fresh=shuffle(bankFor(mode));
  if(fresh.length>1&&state.lastQuestionId&&fresh[fresh.length-1].id===state.lastQuestionId){
    [fresh[fresh.length-1],fresh[0]]=[fresh[0],fresh[fresh.length-1]];
  }
  state[poolName]=fresh;
}

function getNextQuestion(){
  const poolName=state.mode==="regular"?"regularPool":"advancedPool";
  if(!state[poolName].length)refillPool(state.mode);
  const q=state[poolName].pop();
  state.lastQuestionId=q.id;
  return q;
}

function strictWholeNumber(raw){
  const s=String(raw??"").trim().replace(/\s+/g,"");
  if(!s)return null;
  if(!/^\d+$/.test(s))return null;
  const n=Number(s);
  return Number.isSafeInteger(n)?n:null;
}

function newQuestion(){
  state.current=getNextQuestion();
  state.evaluated=false;
  $("#question").textContent=state.current.text;
  $("#answer").value="";$("#answer").disabled=false;$("#check").disabled=false;$("#next").hidden=true;
  $("#feedback").textContent="";$("#feedback").className="feedback";
  $("#showSolution").hidden=true;$("#solution").hidden=true;$("#solution").textContent="";
  $("#answer").focus();
}

function checkAnswer(){
  if(state.evaluated||!state.current)return;
  const raw=$("#answer").value.trim();
  if(!raw){
    $("#feedback").textContent="Enter an answer first.";
    $("#feedback").className="feedback warn";
    return;
  }
  const value=strictWholeNumber(raw);
  if(value===null){
    $("#feedback").textContent="Enter a whole number using digits only.";
    $("#feedback").className="feedback warn";
    return;
  }

  state.evaluated=true;
  $("#answer").disabled=true;$("#check").disabled=true;$("#next").hidden=false;

  if(value===state.current.answer){
    state.correct++;
    $("#feedback").textContent="Correct!";
    $("#feedback").className="feedback correct";
  }else{
    state.incorrect++;
    $("#feedback").textContent=`Incorrect. Correct answer: ${state.current.answerText}`;
    $("#feedback").className="feedback incorrect";
    $("#showSolution").hidden=false;
  }
  $("#correctCount").textContent=state.correct;
  $("#incorrectCount").textContent=state.incorrect;
}

$("#check").addEventListener("click",checkAnswer);
$("#next").addEventListener("click",newQuestion);
$("#showSolution").addEventListener("click",()=>{
  $("#solution").textContent=state.current.explanation;
  $("#solution").hidden=false;$("#showSolution").hidden=true;
});
$("#answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();state.evaluated?newQuestion():checkAnswer()}
  else if(e.key==="Escape"&&!state.evaluated)$("#answer").value="";
});

$("#mathModes").addEventListener("click",e=>{
  const b=e.target.closest("button[data-mode]");if(!b)return;
  state.mode=b.dataset.mode;
  state.lastQuestionId=null;
  $$("#mathModes button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  refillPool(state.mode);
  if(state.view==="practice")newQuestion();
});

$("#contrastBtn").addEventListener("click",()=>{
  const on=document.body.classList.toggle("high-contrast");
  $("#contrastBtn").setAttribute("aria-pressed",String(on));
});

function setView(view){
  state.view=view;const practice=view==="practice";
  $("#practice").style.display=practice?"grid":"none";
  $("#worksheet").style.display=practice?"none":"block";
  $("#practiceBtn").setAttribute("aria-pressed",String(practice));
  $("#worksheetBtn").setAttribute("aria-pressed",String(!practice));
  if(practice)newQuestion();else if(!$("#wsList").children.length)renderWorksheet();
}
$("#practiceBtn").addEventListener("click",()=>setView("practice"));
$("#worksheetBtn").addEventListener("click",()=>setView("worksheet"));

function uniqueWorksheetQuestions(mode,count){
  const bank=bankFor(mode);
  const amount=Math.min(count,bank.length);
  const previous=new Set(state.worksheetPrevious[mode]||[]);
  const fresh=shuffle(bank.filter(q=>!previous.has(q.id)));
  const recycled=shuffle(bank.filter(q=>previous.has(q.id)));
  const selected=[...fresh,...recycled].slice(0,amount);
  state.worksheetPrevious[mode]=selected.map(q=>q.id);
  return selected;
}

function renderWorksheet(){
  const list=$("#wsList");list.innerHTML="";
  const count=Number($("#wsCount").value)||10;
  const questions=uniqueWorksheetQuestions(state.mode,count);

  questions.forEach((q,i)=>{
    const item=document.createElement("div");item.className="ws-item";
    item.innerHTML=`<div class="ws-q"><strong>${i+1}.</strong> ${q.text}</div>
      <div style="margin-top:8px">Answer: ______________________________</div>
      <button class="ws-reveal" aria-expanded="false">Reveal</button>
      <div class="ws-answer">Answer: ${q.answerText}</div>
      <div class="ws-work">${q.explanation}</div>`;
    const b=item.querySelector(".ws-reveal"),a=item.querySelector(".ws-answer"),w=item.querySelector(".ws-work");
    b.addEventListener("click",()=>{
      const showing=a.style.display==="block";
      a.style.display=showing?"none":"block";w.style.display=showing?"none":"block";
      b.textContent=showing?"Reveal":"Hide";b.setAttribute("aria-expanded",String(!showing));
    });
    list.appendChild(item);
  });
}

$("#generateWs").addEventListener("click",renderWorksheet);
$("#revealAll").addEventListener("click",()=>{
  $$("#wsList .ws-answer,#wsList .ws-work").forEach(x=>x.style.display="block");
  $$("#wsList .ws-reveal").forEach(b=>{b.textContent="Hide";b.setAttribute("aria-expanded","true")});
});
$("#hideAll").addEventListener("click",()=>{
  $$("#wsList .ws-answer,#wsList .ws-work").forEach(x=>x.style.display="none");
  $$("#wsList .ws-reveal").forEach(b=>{b.textContent="Reveal";b.setAttribute("aria-expanded","false")});
});
$("#printWs").addEventListener("click",()=>window.print());

function validateQuestionBank(){
  const all=[...regularBank,...advancedBank];
  const ids=new Set(),texts=new Set(),problems=[];
  for(const q of all){
    if(ids.has(q.id))problems.push("Duplicate ID: "+q.id);ids.add(q.id);
    if(texts.has(q.text))problems.push("Duplicate question text: "+q.id);texts.add(q.text);
    if(!Number.isSafeInteger(q.answer)||q.answer<0)problems.push("Invalid answer: "+q.id);
    if(String(q.answer)!==String(q.answerText).replace(/\s/g,""))problems.push("Answer text mismatch: "+q.id);
    if(!q.explanation||q.explanation.length<10)problems.push("Missing explanation: "+q.id);
  }
  console.log(problems.length?"BANK QA: FAIL":"BANK QA: PASS",problems);
}

validateQuestionBank();
refillPool("regular");refillPool("advanced");
newQuestion();
</script>
